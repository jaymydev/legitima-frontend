name: iOS Build

# Pull requests only. Every change lands on main through a squash-merge of an
# already-green pull request, so a push trigger rebuilt the exact same tree a
# second time — doubling the bill for no extra signal. macOS runners are billed
# at ten times the Linux rate, which made that duplicate the single largest
# consumer of the Actions budget.
on:
  pull_request:
    # A Markdown edit does not need a full iOS build.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Pushing again to a branch makes the run in flight worthless: cancel it
# rather than pay for a result nobody will read.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS project
        run: ./scripts/check-build.sh
